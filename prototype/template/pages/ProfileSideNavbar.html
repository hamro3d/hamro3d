<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Sidebar Navigation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1A0E24;
      --surface: #271540;
      --border: #3A2450;
      --text: #F2EDE8;
      --muted: #A898B8;
      --accent: #C4907A;
      --accent-dk: #A07060;
      --font-serif: 'EB Garamond', Georgia, serif;
      --font-sans: 'Jost', sans-serif;
    }

    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%;
      height: 100%;
    }

    /* ─── PROFILE SIDEBAR ─────────────────────────────────── */
    .profile-sidebar {
      border-right: 1px solid var(--border);
      padding: 40px 0;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .sidebar-user {
      padding: 0 28px 32px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .sidebar-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .sidebar-name {
      font-family: var(--font-serif);
      font-size: 18px;
      color: var(--text);
      font-weight: 300;
      margin-bottom: 4px;
    }
    .sidebar-email {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-sans);
      letter-spacing: 0.04em;
    }
    .sidebar-member-badge {
      display: inline-block;
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 3px 8px;
      font-family: var(--font-sans);
      margin-top: 10px;
    }
    .sidebar-nav { 
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .sidebar-nav-label {
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--muted);
      font-family: var(--font-sans);
      padding: 16px 28px 8px;
    }
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 28px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      border-left: 2px solid transparent;
    }
    .sidebar-nav-item:hover { background: rgba(196, 144, 122, 0.06); }
    .sidebar-nav-item.active { border-left-color: var(--accent); background: rgba(196, 144, 122, 0.08); }
    .sidebar-nav-item svg {
      width: 15px;
      height: 15px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .sidebar-nav-item.active svg { stroke: var(--accent); }
    .sidebar-nav-item span {
      font-size: 13px;
      color: var(--muted);
      font-family: var(--font-sans);
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .sidebar-nav-item.active span { color: var(--text); }
    .sidebar-logout {
      padding: 20px 28px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    .logout-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      font-size: 13px;
      color: var(--muted);
      font-family: var(--font-sans);
      transition: color 0.2s;
    }
    .logout-btn:hover { color: #8B2A3A; }
    .logout-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 767px) {
      /* Sidebar hidden on mobile - but iframes usually can't be overridden by parent's media queries */
      /* This will only apply if the iframe itself is at max-width: 767px */
    }
  </style>
</head>
<body>

<script>
  // Handle sidebar navigation - redirect clicks to parent window
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    var logoutBtn = e.target.closest('.logout-btn');
    
    if (link && link.href && !link.target) {
      var href = link.getAttribute('href');
      if (href && !href.startsWith('http') && !href.startsWith('//')) {
        e.preventDefault();
        window.parent.location.href = href;
      }
    }
    
    if (logoutBtn) {
      var onclick = logoutBtn.getAttribute('onclick');
      if (onclick) {
        e.preventDefault();
        eval(onclick);
      }
    }
  });

  // Detect admin vs user pages and toggle nav items
  document.addEventListener('DOMContentLoaded', function() {
    var parentUrl = window.parent.location.pathname;
    var adminPages = ['AdminDashboard', 'ProductList', 'AddProduct', 'UserList'];
    var isAdminPage = adminPages.some(function(page) {
      return parentUrl.includes(page);
    });

    var userNavItems = document.querySelector('[data-user-nav-items]');
    var adminNavItems = document.querySelector('[data-admin-nav-items]');
    var navLabel = document.querySelector('[data-nav-section-label]');

    if (isAdminPage) {
      // Show admin navigation
      if (userNavItems) userNavItems.style.display = 'none';
      if (adminNavItems) adminNavItems.style.display = 'flex';
      if (navLabel) navLabel.textContent = 'ADMIN';
    } else {
      // Show user navigation
      if (userNavItems) userNavItems.style.display = 'flex';
      if (adminNavItems) adminNavItems.style.display = 'none';
      if (navLabel) navLabel.textContent = 'ACCOUNT';
    }

    // Mark active page
    var currentPageName = parentUrl.split('/').pop().replace('.html', '');
    document.querySelectorAll('[data-route]').forEach(function(item) {
      var routePage = item.getAttribute('data-route').replace('.html', '');
      if (routePage === currentPageName) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
  });
</script>

<!-- Sidebar container -->
<aside class="profile-sidebar" role="navigation" aria-label="Profile and account navigation">
  
  <!-- User/Admin info section -->
  <div class="sidebar-user">
    <div class="sidebar-avatar" aria-hidden="true" data-user-initials>AS</div>
    <div class="sidebar-name" data-user-name>Aarav Sharma</div>
    <div class="sidebar-email" data-user-email>aarav@example.com</div>
    <div class="sidebar-member-badge" data-user-badge>MEMBER SINCE 2025</div>
  </div>

  <!-- Navigation section -->
  <nav class="sidebar-nav">
    <!-- Section label that changes based on user type -->
    <div class="sidebar-nav-label" data-nav-section-label>ACCOUNT</div>
    
    <!-- SIDEBAR NAV ITEMS (visible for normal users) -->
    <div data-user-nav-items style="display: flex; flex-direction: column;">
      <a href="Profile.html" class="sidebar-nav-item active" aria-current="page" data-route="Profile.html">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>My Profile</span>
      </a>
      <a href="OrderList.html" class="sidebar-nav-item" data-route="OrderList.html">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>My Orders</span>
      </a>
      <a href="Wishlist.html" class="sidebar-nav-item" data-route="Wishlist.html">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        <span>Wishlist</span>
      </a>
      <a href="Cart.html" class="sidebar-nav-item" data-route="Cart.html">
        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span>Cart</span>
      </a>
    </div>

    <!-- ADMIN NAV ITEMS (visible for admin pages) -->
    <div data-admin-nav-items style="display: none; flex-direction: column;">
      <a href="AdminDashboard.html" class="sidebar-nav-item" data-route="AdminDashboard.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="ProductList.html" class="sidebar-nav-item" data-route="ProductList.html">
        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span>Products</span>
      </a>
      <a href="AddProduct.html" class="sidebar-nav-item" data-route="AddProduct.html">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Add Product</span>
      </a>
      <a href="OrderList.html" class="sidebar-nav-item" data-route="OrderList.html">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>Orders</span>
      </a>
      <a href="UserList.html" class="sidebar-nav-item" data-route="UserList.html">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        <span>Users</span>
      </a>
    </div>
  </nav>

  <!-- Logout section -->
  <div class="sidebar-logout">
    <button type="button" class="logout-btn" onclick="window.parent.location.href='Login.html'" title="Sign out from your account">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span data-logout-text>Sign out</span>
    </button>
  </div>

</aside>

</body>
</html>
