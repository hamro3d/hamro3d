<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --base:        #1A0E24;
      --surface:     #271540;
      --surface-alt: #1F1030;
      --border:      #3A2450;
      --border-light:#4A3060;
      --text-primary:#F2EDE8;
      --text-second: #A898B8;
      --accent:      #C4907A;
      --accent-deep: #A07060;
      --font-serif:  'EB Garamond', Georgia, serif;
      --font-sans:   'Jost', sans-serif;
      --transition:  0.28s ease;
    }

    body { margin: 0; padding: 0; }

    /* ============================================================
       NAVBAR STYLES
    ============================================================ */
    .h3d-nav {
      background: var(--base);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 68px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-logo-mark {
      width: 38px; height: 38px;
      border: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      flex-shrink: 0;
    }
    .nav-logo-mark svg { width: 22px; height: 22px; }
    .nav-brand-text .brand-name {
      font-family: var(--font-serif);
      font-size: 15px;
      letter-spacing: 0.14em;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .nav-brand-text .brand-name span { color: var(--accent); font-weight: 300; }
    .nav-brand-text .brand-sub {
      font-family: var(--font-sans);
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--text-second);
      line-height: 1;
    }
    .nav-links {
      display: flex; gap: 32px;
      list-style: none;
    }
    .nav-links a {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text-second);
      text-decoration: none;
      transition: color var(--transition);
    }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a.active { color: var(--accent); }
    .nav-actions { display: flex; align-items: center; gap: 6px; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.06em;
      cursor: pointer;
      font-family: var(--font-sans);
      font-weight: 600;
    }
    .icon-btn {
      width: 38px; height: 38px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      transition: border-color var(--transition);
    }
    .icon-btn:hover { border-color: var(--accent); }
    .icon-btn svg { width: 16px; height: 16px; stroke: var(--text-second); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke var(--transition); }
    .icon-btn:hover svg { stroke: var(--accent); }
    .badge {
      position: absolute; top: -5px; right: -5px;
      width: 16px; height: 16px;
      background: var(--accent);
      border-radius: 50%;
      font-size: 9px; font-family: var(--font-sans); font-weight: 600;
      color: var(--base);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--base);
    }
    .nav-divider { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
    .nav-login-btn {
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 18px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      background: transparent;
      cursor: pointer;
      text-transform: uppercase;
      transition: background var(--transition), color var(--transition);
      text-decoration: none;
    }
    .nav-login-btn:hover { background: var(--accent); color: var(--base); }
    .nav-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-family: var(--font-sans); font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .nav-hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 4px;
    }
    .nav-hamburger span {
      display: block; width: 22px; height: 1px;
      background: var(--text-second);
      transition: background var(--transition);
    }
    .nav-hamburger:hover span { background: var(--text-primary); }

    .mobile-nav-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: rgba(26,14,36,0.96);
      padding: 24px 28px;
      flex-direction: column;
      gap: 0;
    }
    .mobile-nav-overlay.open { display: flex; }
    .mobile-nav-close {
      align-self: flex-end;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-second);
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 0.1em;
      padding: 8px 0;
    }
    .mobile-nav-overlay .nav-links {
      flex-direction: column;
      gap: 0;
      margin-top: 32px;
    }
    .mobile-nav-overlay .nav-links a {
      display: block;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      color: var(--text-primary);
    }

    @media (max-width: 767px) {
      .h3d-nav { padding: 0 20px; }
      .nav-links, .nav-divider, .nav-login-btn { display: none; }
      .nav-hamburger { display: flex; }
    }
  </style>
</head>
<body>

<script>
  // Handle iframe navigation - redirect clicks to parent window
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a[href]');
    if (link && link.href && !link.target) {
      // Don't intercept external links or links with target
      var href = link.getAttribute('href');
      if (href && !href.startsWith('http') && !href.startsWith('//')) {
        // Prevent default and navigate parent window
        e.preventDefault();
        window.parent.location.href = href;
      }
    }
  });
</script>

<div class="mobile-nav-overlay" id="mobileNav">
  <button class="mobile-nav-close" onclick="document.getElementById('mobileNav').classList.remove('open')">CLOSE ✕</button>
  <ul class="nav-links">
    <li><a href="Home.html" class="active">Explore</a></li>
    <li><a href="Products.html">Products</a></li>
    <li><a href="About.html">Our Story</a></li>
    <li><a href="Contact.html">Connect</a></li>
  </ul>
</div>

<nav class="h3d-nav" role="navigation" aria-label="Main navigation">
  <a href="Home.html" class="nav-brand" aria-label="Hamro3D Home">
    <div class="nav-logo-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="12,3 21,8 21,16 12,21 3,16 3,8" stroke="#C4907A" stroke-width="1.2" fill="none"/>
        <polygon points="12,7 17,9.5 17,14.5 12,17 7,14.5 7,9.5" stroke="#A898B8" stroke-width="0.8" fill="none"/>
        <circle cx="12" cy="12" r="1.5" fill="#C4907A"/>
      </svg>
    </div>
    <div class="nav-brand-text">
      <div class="brand-name">HAMRO<span>3D</span></div>
      <div class="brand-sub">हाम्रो 3D · Kathmandu</div>
    </div>
  </a>

  <ul class="nav-links" role="list">
    <li><a href="Products.html">Products</a></li>
    <li><a href="About.html">Our Story</a></li>
    <li><a href="Contact.html">Connect</a></li>
  </ul>

  <div class="nav-actions">
    <a href="Wishlist.html" class="icon-btn" title="Wishlist" aria-label="Wishlist (2 items)">
      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      <span class="badge" aria-hidden="true">2</span>
    </a>
    <a href="Cart.html" class="icon-btn" title="Cart" aria-label="Cart (3 items)">
      <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span class="badge" aria-hidden="true">3</span>
    </a>
    <div class="nav-divider" aria-hidden="true"></div>
    <a href="Auth.html" class="nav-login-btn" aria-label="Login or sign up to your account">Login / Signup</a>
    <a href="AdminDashboard.html" class="avatar" role="button" tabindex="0" aria-label="Admin account" aria-current="page">AD</a>
    <button class="nav-hamburger" aria-label="Open menu" aria-expanded="false" onclick="document.getElementById('mobileNav').classList.add('open')">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

</body>
</html>
